services:
  normalizer:
    build: .
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:8767:10000"
    cpus: 4
    mem_limit: 8g
    pids_limit: 128
    environment:
      DATA_DIR: /var/data
      JOB_WORKERS: 2
      WORKER_MEMORY_MB: 3072
      MAX_UPLOAD_GB: 20
      RETENTION_HOURS: 24
      MAX_ACTIVE_JOBS: 20
    volumes:
      - pdf-jobs:/var/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
volumes:
  pdf-jobs:
